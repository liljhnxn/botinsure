<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="botchainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0066FE" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal / Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#0A0F1D" stroke="url(#botchainGrad)" stroke-width="2.5" />
  
  <!-- Circuit Nodes & Grid Background -->
  <circle cx="24" cy="24" r="3" fill="#00F2FE" opacity="0.4" />
  <circle cx="76" cy="24" r="3" fill="#00F2FE" opacity="0.4" />
  <circle cx="24" cy="76" r="3" fill="#10B981" opacity="0.4" />
  <circle cx="76" cy="76" r="3" fill="#10B981" opacity="0.4" />
  <line x1="24" y1="24" x2="36" y2="36" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.3" />
  <line x1="76" y1="24" x2="64" y2="36" stroke="#00F2FE" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.3" />
  
  <!-- Stylized BOT Chain 'B' Nodes Block -->
  <!-- Vertical backbone -->
  <path d="M34 26 H48 C58 26 64 31 64 39 C64 45 60 48 55 50 C62 52 66 56 66 63 C66 71 59 76 48 76 H34 C31.8 76 30 74.2 30 72 V30 C30 27.8 31.8 26 34 26 Z" 
        fill="none" 
        stroke="url(#botchainGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#logoGlow)" />
        
  <!-- Upper loop inner node -->
  <circle cx="46" cy="38" r="4.5" fill="url(#neonGlow)" />
  <!-- Lower loop inner node -->
  <circle cx="47" cy="63" r="5" fill="url(#neonGlow)" />
  
  <!-- Central connector line -->
  <line x1="32" y1="50" x2="52" y2="50" stroke="#00F2FE" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Tech Accent Sparkles -->
  <circle cx="78" cy="48" r="2.5" fill="#00F2FE" />
</svg>
