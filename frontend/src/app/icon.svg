<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="64" height="64" rx="16" fill="#080b11" />
  <rect width="64" height="64" rx="16" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Glowing Shield Outline -->
  <path d="M32 10 L48 16 V29 C48 40.5 41 49.5 32 54 C23 49.5 16 40.5 16 29 V16 Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Shield Core -->
  <path d="M32 15 L44 20 V29 C44 38 38.5 45.2 32 49 C25.5 45.2 20 38 20 29 V20 Z" 
        fill="url(#innerGlow)" 
        fill-opacity="0.2" />

  <!-- Parametric Protection Nodes & Heartbeat Lines -->
  <path d="M25 32 L30 32 L33 26 L36 38 L39 32 L43 32" 
        stroke="#22d3ee" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Pulse Core Node -->
  <circle cx="32" cy="18" r="2.5" fill="#06b6d4" />
</svg>
